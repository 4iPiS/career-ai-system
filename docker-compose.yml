services:
  career-ai:
    build: .
    container_name: career-ai
    ports:
      - "7777:7777"
    environment:
      HOST: "0.0.0.0"
      PORT: "7777"
      TF_CPP_MIN_LOG_LEVEL: "3"
      PYTHONUNBUFFERED: "1"
    volumes:
      - career_model:/app/career_model
      - career_data:/app/data
      - career_output:/app/output
    restart: unless-stopped

volumes:
  career_model:
  career_data:
  career_output:
